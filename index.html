<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#185d50"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>스도쿠 탐험</title><link rel="stylesheet" href="style.css"></head><body><main>
<header class="brand"><span class="brand-mark" aria-hidden="true"><i>1</i><i></i><i></i><i>4</i></span><div><h1>스도쿠 탐험</h1><p>숫자로 여는 작은 모험</p></div></header>
<section id="home">
<section class="adventure-card" aria-labelledby="adventure-title"><div class="hero-top"><div><span class="card-label">풀이 방법 배우기</span><h2 id="adventure-title">한 칸씩 배우고,<br>9×9에 도전해요.</h2></div><div class="board-art" aria-hidden="true"><span>1</span><span></span><span>3</span><span></span><span>5</span><span></span><span></span><span>5</span><span></span><span>1</span><span></span><span>3</span><span>2</span><span></span><span>4</span><span></span><span>6</span><span></span><span></span><span>6</span><span></span><span>2</span><span></span><span>4</span><span>3</span><span></span><span>5</span><span></span><span>1</span><span></span><span></span><span>1</span><span></span><span>3</span><span></span><span>5</span></div></div>
<div class="journey-meta"><span>6×6에서 9×9까지</span><strong id="stage-progress" role="status"></strong></div><div id="journey-dots" aria-hidden="true"></div>
<div class="next-stage"><span id="next-stage-label"></span><strong id="next-stage-title"></strong></div><button id="continue-stage" class="primary-action">1단계 시작하기 <span aria-hidden="true">→</span></button><button id="learn" class="stage-toggle" aria-expanded="false" aria-controls="lesson-picker">전체 22단계 보기 <span aria-hidden="true">⌄</span></button>
</section>
<section class="free-play" aria-labelledby="free-title"><div class="section-heading"><h2 id="free-title">문제 풀기</h2><span>한 판에 집중하는 시간</span></div><div id="play-picker"><button id="play-6" class="puzzle-card"><span class="size-symbol" aria-hidden="true">6<span>×</span>6</span><span class="puzzle-copy"><strong>가볍게 한 판</strong><span>6×6 스도쿠</span><small id="resume-label"></small></span><span class="card-arrow" aria-hidden="true">↗</span></button><button id="play-9" class="puzzle-card"><span class="size-symbol" aria-hidden="true">9<span>×</span>9</span><span class="puzzle-copy"><strong>더 큰 도전</strong><span>9×9 스도쿠</span></span><span id="nine-badge" class="lock-badge">잠김</span></button></div><p id="unlock-note"></p></section>
<section id="lesson-picker" hidden><div class="section-heading"><h2>탐험 지도</h2><span>클리어한 단계도 다시 풀 수 있어요</span></div><div id="stage-list"></div></section>
<footer class="home-footer"><span>시간 제한 없이, 나만의 속도로.</span><button id="install-app" hidden>홈 화면에 설치</button><p id="ios-install" hidden>Safari의 공유 메뉴에서 ‘홈 화면에 추가’를 선택하세요.</p></footer></section>
<section id="game" class="game" hidden><div class="playbar"><button id="home-back">‹ 홈</button><span id="mode-label"></span><button id="new-top">새 문제</button></div><h2 id="stage-title" hidden></h2><div id="board" role="group" aria-label="스도쿠 보드"></div><div id="numbers" aria-label="숫자 입력"></div><div id="tools" class="tools"><button id="memo" aria-pressed="false">메모</button><button id="erase">지우기</button><button id="undo">되돌리기</button></div><aside id="feedback" hidden><div id="message" role="status" aria-live="polite"></div><div id="success" hidden></div></aside><button id="hint">힌트 보기</button></section>
</main><script type="module" src="src/app.js"></script><script src="/pwa.js" defer></script></body></html>
