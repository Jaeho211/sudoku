<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#185d50"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>스도쿠 탐험</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="eyebrow">생각하며 한 칸씩</div><h1>스도쿠 탐험<span>✦</span></h1><p>숫자의 자리를 발견하는 즐거움</p></header><section id="home"><nav aria-label="모드"><button id="learn">풀이 방법 배우기</button><button id="play">문제 풀기<span id="resume-label"></span></button></nav><button id="install-app" hidden>앱 설치하기</button><p id="ios-install" hidden>Safari의 공유 메뉴에서 ‘홈 화면에 추가’를 선택하세요.</p><section id="lesson-picker"><button data-type="single"><strong>1단계 · 이 칸에는 하나만</strong><span>가로 · 세로 · 상자의 단서를 모아봐요</span></button><button data-type="hidden"><strong>2단계 · 이 숫자는 여기만</strong><span>숫자가 들어갈 자리를 찾아봐요</span></button></section></section><section class="game" hidden><div class="playbar"><button id="home-back" aria-label="홈으로 돌아가기">‹ 홈</button><span id="mode-label">문제 풀기 · 6×6</span><button id="new-top">새 문제</button></div><div class="heading"><div><small id="tag">6 × 6 · 자유 풀이</small><h2 id="title">한 칸씩 찾아봐요</h2></div><button id="new" hidden>새 문제</button></div><div id="board" role="group" aria-label="스도쿠 보드"></div><div id="numbers" aria-label="숫자 입력"></div><div class="tools"><button id="memo" aria-pressed="false">메모</button><button id="erase">지우기</button><button id="undo">되돌리기</button></div><aside id="feedback"><div id="message" role="status" aria-live="polite">빈칸을 선택하고 숫자를 눌러보세요.</div></aside><button id="hint">힌트 보기</button><div id="success" hidden></div><p class="footnote">가로 · 세로 · 작은 상자에 1~6을 한 번씩 넣어요.<br>시간 제한 없이, 천천히 생각해도 괜찮아요.</p></section></main><script type="module" src="src/app.js"></script><script src="/pwa.js" defer></script></body></html>
