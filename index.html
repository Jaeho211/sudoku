<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#185d50"><title>스도쿠 탐험</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="eyebrow">생각하며 한 칸씩</div><h1>스도쿠 탐험<span>✦</span></h1><p>숫자의 자리를 발견하는 즐거움</p></header><nav aria-label="모드"><button id="learn">풀이 방법 배우기</button><button id="play">문제 풀기</button></nav><section id="lesson-picker"><button data-type="single"><strong>이 칸에는 하나만</strong><span>가로 · 세로 · 상자의 단서를 모아봐요</span></button><button data-type="hidden"><strong>이 숫자는 여기만</strong><span>숫자가 들어갈 자리를 찾아봐요</span></button></section><section class="game"><div class="heading"><div><small id="tag">6 × 6 · 자유 풀이</small><h2 id="title">한 칸씩 찾아봐요</h2></div><button id="new">새 문제</button></div><div id="board" role="group" aria-label="스도쿠 보드"></div><div id="numbers" aria-label="숫자 입력"></div><div class="tools"><button id="memo" aria-pressed="false">메모</button><button id="erase">지우기</button><button id="undo">되돌리기</button></div><aside><div id="message" role="status" aria-live="polite">빈칸을 선택하고 숫자를 눌러보세요.</div><button id="hint">힌트 보기</button></aside><div id="success" hidden></div><p class="footnote">가로 · 세로 · 작은 상자에 1~6을 한 번씩 넣어요.<br>시간 제한 없이, 천천히 생각해도 괜찮아요.</p></section></main><script type="module" src="src/app.js"></script></body></html>
