<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#185d50"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>스도쿠 탐험</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><div class="eyebrow">생각하며 한 칸씩</div><h1>스도쿠 탐험<span>✦</span></h1><p>한 단계씩 배우고, 9×9에 도전해요</p></header>
<section id="home"><nav aria-label="모드"><button id="learn">풀이 방법 배우기</button><button id="play">문제 풀기<span id="resume-label"></span></button></nav><button id="install-app" hidden>앱 설치하기</button><p id="ios-install" hidden>Safari의 공유 메뉴에서 ‘홈 화면에 추가’를 선택하세요.</p>
<section id="lesson-picker" hidden><h2>9×9로 가는 스테이지</h2><p id="stage-progress" role="status"></p><div id="stage-list"></div></section>
<section id="play-picker" hidden><button id="play-6">6×6 문제 풀기</button><button id="play-9">9×9 문제 풀기</button><p id="unlock-note"></p></section></section>
<section id="game" class="game" hidden><div class="playbar"><button id="home-back">‹ 홈</button><span id="mode-label"></span><button id="new-top">새 문제</button></div><h2 id="stage-title" hidden></h2><div id="board" role="group" aria-label="스도쿠 보드"></div><div id="numbers" aria-label="숫자 입력"></div><div id="tools" class="tools"><button id="memo" aria-pressed="false">메모</button><button id="erase">지우기</button><button id="undo">되돌리기</button></div><aside id="feedback" hidden><div id="message" role="status" aria-live="polite"></div><div id="success" hidden></div></aside><button id="hint">힌트 보기</button></section>
</main><script type="module" src="src/app.js"></script><script src="/pwa.js" defer></script></body></html>
